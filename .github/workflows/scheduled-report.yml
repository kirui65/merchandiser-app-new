# Asks the API to send the scheduled report email. The API decides whether a
# report is due (daily, or the configured weekday) and skips repeats, so this
# runs every day. Requires repository secrets API_URL (e.g.
# https://brandsphere-backend-kgvr.onrender.com) and REPORTS_CRON_SECRET.
name: Scheduled report email

on:
  schedule:
    - cron: '7 4 * * *' # 07:07 Nairobi time
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the API
        # The free Render service sleeps when idle; give it time to start.
        run: curl --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 "${{ secrets.API_URL }}/health"
      - name: Send report if due
        run: |
          curl --silent --show-error --fail-with-body --max-time 120 \
            -X POST "${{ secrets.API_URL }}/api/reports/scheduled/run" \
            -H "x-cron-secret: ${{ secrets.REPORTS_CRON_SECRET }}"
